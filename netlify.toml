# Hospedagem: Netlify (decisão de 18/09/2026 — manter, não migrar para Vercel).
# Site estático, sem build step: a raiz do repo é publicada como está.
# A pasta _arquivo/ fica fora do deploy por estar no .gitignore.
[build]
  publish = "."
  command = ""

# URLs limpas: /documentacao em vez de /documentacao.html
[[redirects]]
  from = "/documentacao"
  to = "/documentacao.html"
  status = 301

[[redirects]]
  from = "/privacidade"
  to = "/privacidade.html"
  status = 301

[[redirects]]
  from = "/termos"
  to = "/termos.html"
  status = 301

# QR codes impressos (cartões/adesivos): o adesivo grava SÓ /q/<slug>; o destino
# muda aqui sem reimprimir. 302 = temporário (navegador não guarda em cache).
[[redirects]]
  from = "/q/aguada"
  to = "/produtos/aguada"
  status = 302

[[redirects]]
  from = "/q/cmms"
  to = "https://pmoc-orcin.vercel.app/"
  status = 302

[[redirects]]
  from = "/q/refrigeracao"
  to = "https://pmoc-orcin.vercel.app/refrigeracao"
  status = 302

[[redirects]]
  from = "/q/*"
  to = "/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Arquivos de trabalho do repositório que não são páginas: nunca servir, em deploy por Git ou pela CLI
[[redirects]]
  from = "/tools/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/_arquivo/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/TODO.md"
  to = "/404"
  status = 404
  force = true
