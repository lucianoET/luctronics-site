# Hospedagem: Netlify (decisão de 18/09/2026 — manter, não migrar para Vercel).
# Site estático, sem build step: a raiz do repo é publicada como está.
# A pasta _arquivo/ fica fora do deploy por estar no .gitignore.
[build]
  publish = "."
  command = ""

# URLs limpas: /documentacao em vez de /documentacao.html
[[redirects]]
  from = "/documentacao"
  to = "/documentacao.html"
  status = 301

[[redirects]]
  from = "/privacidade"
  to = "/privacidade.html"
  status = 301

[[redirects]]
  from = "/termos"
  to = "/termos.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
